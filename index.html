<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Иссиқлик? — 5-дневная средняя температура</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; --muted:#94a3b8; --warm:#ea580c; --cold:#2563eb; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text);
         min-height:100vh; display:flex; justify-content:center; padding:24px 16px; }
  main { width:100%; max-width:640px; }
  h1 { font-size:1.4rem; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 20px; font-size:.95rem; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  select, input, button.small { font:inherit; padding:10px 12px; border-radius:8px; border:1px solid #334155; background:var(--card); color:var(--text); }
  select { flex:1 1 220px; } input { flex:1 1 200px; }
  button.small { cursor:pointer; }
  #big { display:block; width:100%; margin:24px 0; padding:48px 16px; border:none; border-radius:24px; cursor:pointer;
         font-size:clamp(2.5rem,12vw,5rem); font-weight:900; letter-spacing:.05em; color:#fff; background:#475569;
         box-shadow:0 10px 30px rgba(0,0,0,.4); transition:background .3s, transform .1s; }
  #big:active { transform:scale(.98); }
  #big.warm { background:linear-gradient(135deg,#f97316,#dc2626); }
  #big.cold { background:linear-gradient(135deg,#38bdf8,#1d4ed8); }
  #big small { display:block; font-size:1rem; font-weight:500; letter-spacing:0; opacity:.9; margin-top:8px; }
  .card { background:var(--card); border-radius:12px; padding:16px; }
  table { width:100%; border-collapse:collapse; font-size:.95rem; }
  td, th { padding:6px 4px; text-align:left; border-bottom:1px solid #334155; }
  td:last-child, th:last-child { text-align:right; }
  .err { color:#f87171; }
  footer { color:var(--muted); font-size:.8rem; margin-top:16px; }
  a { color:#7dd3fc; }
</style>
</head>
<body>
<main>
  <h1 id="h1"></h1>
  <p class="sub" id="lead"></p>

  <div class="row">
    <select id="city"></select>
  </div>
  <div class="row">
    <input id="search">
    <button class="small" id="searchBtn"></button>
  </div>
  <div class="row" id="results"></div>

  <button id="big">…</button>

  <div class="card" id="details"></div>

  <div class="card" id="forecast" style="margin-top:16px"></div>

  <footer id="footer"></footer>
</main>

<script>
const THRESHOLD = 8;

// Язык: английский, если язык системы/браузера английский, иначе русский
const EN = /^en\b/i.test(navigator.language || "");
const T = EN ? {
  lang: "en", locale: "en-GB",
  title: "Heating? — 5-day average temperature",
  h1: "Is the heating on?",
  lead: `Average 24-hour temperature over the last 5 days (120 hours). Threshold: ${THRESHOLD} °C.`,
  searchPh: "Another city (e.g. Termez, Bishkek)…", find: "Search", refresh: "Refresh",
  loading: "Loading…", searching: "Searching…", notFound: "Nothing found",
  footer: `Data: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> (free, no API key).`,
  heatOn: "HEAT ON", freezing: "FREEZING",
  notEnough: "Not enough data", loadErr: "Loading error", searchErr: "Search error",
  date: "Date", hours: "Hours", avg: "Average", h: "h",
  total: n => `Total (${n} h)`, period: "Period",
  seasonTitle: "Heating season",
  already: `The 5-day average is already below ${THRESHOLD} °C — by the rule, the heating should already be on.`,
  computing: "Calculating the heating season forecast…",
  fcTitle: "When will the heating season start?",
  opt: "😊 Optimistic (heat sooner)", med: "🎯 Most likely", pes: "😬 Pessimistic (heat later)",
  later: d => `after ${d}`,
  sure: "The threshold is crossed within the 16-day weather forecast — all scenarios agree.",
  model: (end, n) => `Model: 16-day weather forecast (until ${end}), then the weather on the same dates in each of the past ${n} years. Date = first day the 5-day average is &lt; ${THRESHOLD} °C.`,
  history: "Past years", notCrossed: "threshold not crossed",
  noHist: "no historical data", fcErr: "Could not build the forecast",
} : {
  lang: "ru", locale: "ru-RU",
  title: "Иссиқлик? — 5-дневная средняя температура",
  h1: "Иссиқлик бериладими? / Дадут тепло?",
  lead: `Средняя суточная температура за последние 5 дней (120 часов). Порог — ${THRESHOLD} °C.`,
  searchPh: "Другой город (напр. Термез, Бишкек)…", find: "Найти", refresh: "Обновить",
  loading: "Загрузка…", searching: "Поиск…", notFound: "Ничего не найдено",
  footer: `Данные: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> (бесплатно, без ключа).`,
  heatOn: "ИССИҚЛИК", freezing: "МЕРЗНЕМ",
  notEnough: "Недостаточно данных", loadErr: "Ошибка загрузки", searchErr: "Ошибка поиска",
  date: "Дата", hours: "Часов", avg: "Средняя", h: "ч",
  total: n => `Итого (${n} ч)`, period: "Период",
  seasonTitle: "Отопительный сезон",
  already: `Средняя за 5 суток уже ниже ${THRESHOLD} °C — по правилу отопление уже должно быть включено.`,
  computing: "Считаю прогноз начала отопительного сезона…",
  fcTitle: "Когда начнётся отопительный сезон?",
  opt: "😊 Оптимистичный (тепло раньше)", med: "🎯 Наиболее вероятный", pes: "😬 Пессимистичный (тепло позже)",
  later: d => `позже ${d}`,
  sure: "Порог пересекается уже в пределах 16-дневного прогноза погоды — все сценарии совпадают.",
  model: (end, n) => `Модель: 16-дневный прогноз погоды (до ${end}), дальше — погода тех же дат в каждом из прошлых ${n} лет. Дата — первый день, когда средняя за 5 суток &lt; ${THRESHOLD} °C.`,
  history: "Как было в прошлые годы", notCrossed: "порог не пересечён",
  noHist: "нет исторических данных", fcErr: "Не удалось построить прогноз",
};

const CITIES = [
  // Узбекистан
  ["Ташкент","Tashkent",41.2995,69.2401],["Самарканд","Samarkand",39.6542,66.9597],["Бухара","Bukhara",39.7681,64.4556],
  ["Наманган","Namangan",40.9983,71.6726],["Андижан","Andijan",40.7821,72.3442],["Фергана","Fergana",40.3864,71.7864],
  ["Нукус","Nukus",42.4531,59.6103],["Карши","Karshi",38.8606,65.7891],["Термез","Termez",37.2242,67.2783],
  ["Ургенч","Urgench",41.5500,60.6333],["Джизак","Jizzakh",40.1158,67.8422],["Навои","Navoi",40.0844,65.3792],
  ["Гулистан","Gulistan",40.4897,68.7842],["Хива","Khiva",41.3783,60.3639],
  // СНГ
  ["Москва","Moscow",55.7558,37.6173],["Санкт-Петербург","Saint Petersburg",59.9343,30.3351],["Алматы","Almaty",43.2220,76.8512],
  ["Астана","Astana",51.1694,71.4491],["Бишкек","Bishkek",42.8746,74.5698],["Душанбе","Dushanbe",38.5598,68.7870],
  ["Ашхабад","Ashgabat",37.9601,58.3261],["Баку","Baku",40.4093,49.8671],["Ереван","Yerevan",40.1792,44.4991],
  ["Минск","Minsk",53.9006,27.5590],["Кишинёв","Chisinau",47.0105,28.8638],["Новосибирск","Novosibirsk",55.0084,82.9357],
];

const $ = id => document.getElementById(id);
document.documentElement.lang = T.lang;
document.title = T.title;
$("h1").textContent = T.h1;
$("lead").textContent = T.lead;
$("search").placeholder = T.searchPh;
$("searchBtn").textContent = T.find;
$("big").title = T.refresh;
$("details").textContent = T.loading;
$("footer").innerHTML = T.footer;

const sel = $("city");
CITIES.forEach(([ru,en,la,lo]) => { const n = EN ? en : ru; sel.add(new Option(n, `${la},${lo},${n}`)); });

function saved() { try { return localStorage.getItem("city"); } catch { return null; } }
function save(v) { try { localStorage.setItem("city", v); } catch {} }

function addCustom(name, lat, lon) {
  const v = `${lat},${lon},${name}`;
  // Тот же город из списка (по координатам) — выбираем его, чтобы название было на текущем языке
  const same = [...sel.options].find(o => o.value.startsWith(`${lat},${lon},`));
  if (same) { sel.value = same.value; return; }
  sel.add(new Option(name, v));
  sel.value = v;
}

async function load() {
  const [lat, lon, name] = sel.value.split(",");
  save(sel.value);
  const big = $("big"), det = $("details");
  big.className = ""; big.textContent = "…"; det.textContent = T.loading;
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
                `&hourly=temperature_2m&daily=temperature_2m_mean&past_days=5&forecast_days=16&timezone=auto`;
    const r = await fetch(url);
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();

    // Текущее местное время города (в формате API: YYYY-MM-DDTHH:MM)
    const nowLocal = new Date(Date.now() + d.utc_offset_seconds * 1000).toISOString().slice(0,16);
    const pts = d.hourly.time.map((t,i) => [t, d.hourly.temperature_2m[i]])
                 .filter(([t,v]) => t <= nowLocal && v != null)
                 .slice(-120);
    if (pts.length < 24) throw new Error(T.notEnough);

    const avg = pts.reduce((s,[,v]) => s+v, 0) / pts.length;
    const heat = avg < THRESHOLD;

    big.className = heat ? "warm" : "cold";
    big.innerHTML = (heat ? T.heatOn : T.freezing) +
      `<small>${name}: ${avg.toFixed(1)} °C ${heat ? "<" : "≥"} ${THRESHOLD} °C</small>`;

    // Разбивка по суткам
    const days = {};
    pts.forEach(([t,v]) => (days[t.slice(0,10)] ??= []).push(v));
    const rows = Object.entries(days).map(([day, vs]) =>
      `<tr><td>${day}</td><td>${vs.length} ${T.h}</td><td>${(vs.reduce((a,b)=>a+b,0)/vs.length).toFixed(1)} °C</td></tr>`).join("");
    det.innerHTML = `<table><tr><th>${T.date}</th><th>${T.hours}</th><th>${T.avg}</th></tr>${rows}
      <tr><th>${T.total(pts.length)}</th><th></th><th>${avg.toFixed(1)} °C</th></tr></table>
      <p class="sub" style="margin:8px 0 0">${T.period}: ${pts[0][0].replace("T"," ")} — ${pts.at(-1)[0].replace("T"," ")} (${d.timezone})</p>`;

    predict(lat, lon, d, nowLocal.slice(0,10), heat);
  } catch (e) {
    big.textContent = "?";
    det.innerHTML = `<span class="err">${T.loadErr}: ${e.message}</span>`;
    $("forecast").innerHTML = "";
  }
}

// ---------- Прогноз начала отопительного сезона ----------
// Модель «аналоговых лет»: ближайшие 16 дней берём из прогноза погоды, а дальше
// подставляем фактические суточные температуры того же периода каждого из
// прошлых 10 лет. Для каждого сценария ищем первый день, когда средняя за 5 суток
// опускается ниже порога. Самый ранний сценарий — оптимистичный (тепло дадут раньше),
// самый поздний — пессимистичный, медиана — наиболее вероятный.
const YEARS = 10;
const addDays = (s, n) => new Date(Date.parse(s) + n * 864e5).toISOString().slice(0,10);
const minusYears = (s, k) => (+s.slice(0,4) - k) + s.slice(4);
const fmtDate = s => new Date(s + "T00:00:00Z").toLocaleDateString(T.locale, { day:"numeric", month:"long", year:"numeric", timeZone:"UTC" });

// Первый день в [from, to], когда средняя за 5 суток < порога; null — не наступил; undefined — нет данных
function firstCrossing(val, from, to) {
  const win = [];
  for (let s = addDays(from, -4); s <= to; s = addDays(s, 1)) {
    const v = val(s);
    if (v == null) return undefined;
    win.push(v);
    if (win.length > 5) win.shift();
    if (s >= from && win.length === 5 && win.reduce((a,b) => a+b) / 5 < THRESHOLD) return s;
  }
  return null;
}

async function predict(lat, lon, d, today, heat) {
  const box = $("forecast");
  const y = +today.slice(0,4), m = +today.slice(5,7);
  const seasonYear = m < 3 ? y - 1 : y;                 // год, осенью которого начинается сезон
  const from = (m >= 3 && m < 8) ? `${y}-08-01` : today; // весной/летом считаем с 1 августа
  const to = `${seasonYear + 1}-02-28`;

  if (from === today && heat) {
    box.innerHTML = `<h3 style="margin-top:0">${T.seasonTitle}</h3><p>${T.already}</p>`;
    return;
  }
  box.textContent = T.computing;
  try {
    const fc = {};
    d.daily.time.forEach((t,i) => { const v = d.daily.temperature_2m_mean[i]; if (v != null) fc[t] = v; });

    const r = await fetch(`https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lon}` +
      `&start_date=${y - YEARS - 1}-01-01&end_date=${addDays(today, -7)}&daily=temperature_2m_mean&timezone=auto`);
    if (!r.ok) throw new Error("HTTP " + r.status);
    const a = await r.json();
    const hist = {};
    a.daily.time.forEach((t,i) => { const v = a.daily.temperature_2m_mean[i]; if (v != null) hist[t] = v; });
    // 29 февраля в невисокосном году — берём 28-е
    const past = (s, k) => hist[minusYears(s, k)] ?? hist[minusYears(addDays(s, -1), k)];

    const scenarios = [], history = [];
    for (let k = 1; k <= YEARS; k++) {
      const date = firstCrossing(s => fc[s] ?? past(s, k), from, to);
      if (date !== undefined) scenarios.push({ year: seasonYear - k, date });
      const h = firstCrossing(s => hist[s], `${seasonYear - k}-08-01`, `${seasonYear - k + 1}-02-28`);
      if (h !== undefined) history.push({ year: seasonYear - k, date: h });
    }
    if (!scenarios.length) throw new Error(T.noHist);

    // Сценарии без перехода через порог (null) — самые поздние
    const key = sc => sc.date ?? "9999";
    scenarios.sort((p, q) => key(p).localeCompare(key(q)));
    const show = sc => sc.date ? fmtDate(sc.date) : T.later(fmtDate(to));
    const opt = scenarios[0], med = scenarios[Math.floor((scenarios.length - 1) / 2)], pes = scenarios.at(-1);
    const fcEnd = d.daily.time.at(-1);
    const sure = opt.date && pes.date && opt.date === pes.date && opt.date <= fcEnd;

    box.innerHTML = `<h3 style="margin-top:0">${T.fcTitle}</h3>
      <table>
        <tr><td>${T.opt}</td><td>${show(opt)}</td></tr>
        <tr><td>${T.med}</td><td><b>${show(med)}</b></td></tr>
        <tr><td>${T.pes}</td><td>${show(pes)}</td></tr>
      </table>
      <p class="sub" style="margin:8px 0 0">${sure ? T.sure : T.model(fmtDate(fcEnd), scenarios.length)}</p>
      <details style="margin-top:8px"><summary class="sub" style="cursor:pointer">${T.history}</summary>
        <table>${history.map(h => `<tr><td>${h.year}</td><td>${h.date ? fmtDate(h.date) : T.notCrossed}</td></tr>`).join("")}</table>
      </details>`;
  } catch (e) {
    box.innerHTML = `<span class="err">${T.fcErr}: ${e.message}</span>`;
  }
}

async function search() {
  const q = $("search").value.trim(), box = $("results");
  if (!q) return;
  box.textContent = T.searching;
  try {
    const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=8&language=${T.lang}`);
    const d = await r.json();
    box.innerHTML = "";
    if (!d.results?.length) { box.textContent = T.notFound; return; }
    d.results.forEach(c => {
      const b = document.createElement("button");
      b.className = "small";
      b.textContent = `${c.name}${c.admin1 ? ", " + c.admin1 : ""}${c.country ? ", " + c.country : ""}`;
      b.onclick = () => { addCustom(c.name, c.latitude, c.longitude); box.innerHTML = ""; load(); };
      box.append(b);
    });
  } catch (e) { box.innerHTML = `<span class="err">${T.searchErr}: ${e.message}</span>`; }
}

const s = saved();
if (s) { const [la,lo,...n] = s.split(","); addCustom(n.join(","), la, lo); }
sel.onchange = load;
$("big").onclick = load;
$("searchBtn").onclick = search;
$("search").onkeydown = e => { if (e.key === "Enter") search(); };
load();
</script>
</body>
</html>
